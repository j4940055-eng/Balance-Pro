<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>MoneyTalks | ניהול נתונים</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#748198;--line:#e5eaf2;--blue:#2864f0;--green:#12b76a;--red:#e5484d;--orange:#f59e0b;--shadow:0 10px 28px #23395d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:520px;margin:auto;padding:18px 14px 50px}.head,.row{display:flex;align-items:center;gap:10px}.head{justify-content:space-between}.back{border:0;background:#fff;border-radius:14px;padding:10px 13px;color:var(--blue);font-size:18px;box-shadow:var(--shadow)}h1{font-size:23px;margin:8px 0}.muted,.small{color:var(--muted);font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:12px;box-shadow:var(--shadow)}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.grow{flex:1}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;background:#2864f012;color:var(--blue)}button,input,select{font:inherit}.btn,.danger,.soft,.warning{width:100%;border-radius:13px;padding:12px;font-weight:800;margin-top:9px}.btn{border:0;background:linear-gradient(135deg,#3b82f6,#2864f0);color:#fff}.soft{border:1px solid #2864f033;background:#2864f00b;color:var(--blue)}.warning{border:1px solid #f59e0b44;background:#f59e0b10;color:#a16207}.danger{border:1px solid #e5484d55;background:#e5484d0e;color:var(--red)}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;color:var(--red);font-size:10px}.field{display:grid;grid-template-columns:115px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.field input,.field select{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.dangerZone{border-color:#e5484d44;background:#fffafa}.sectionTitle{font-size:15px;margin:0 0 8px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px}.metric b{display:block;font-size:19px;margin-top:4px}.notice{margin-top:10px;padding:10px;border-radius:12px;background:#2864f00b;color:var(--muted);font-size:11px}.hidden{display:none}</style></head><body><main class="app"><div class="head"><div><h1>🗂️ ניהול נתונים</h1><div class="muted">מחיקה נקודתית, חלקית או איפוס מלא</div></div><button class="back" onclick="location.href='./'">‹</button></div><section class="card"><div class="summary"><div class="metric"><span class="small">תנועות</span><b id="txCount">0</b></div><div class="metric"><span class="small">מסמכים</span><b id="docCount">0</b></div><div class="metric"><span class="small">יעדים</span><b id="goalCount">0</b></div><div class="metric"><span class="small">חובות/הלוואות</span><b id="debtCount">0</b></div></div><button class="soft" id="backup">💾 הורד גיבוי לפני מחיקה</button></section><section class="card"><h2 class="sectionTitle">מחיקה נקודתית</h2><div class="muted">מחק רק פריט מסוים, בלי להשפיע על שאר הנתונים.</div><div id="items"></div></section><section class="card"><h2 class="sectionTitle">מחיקה חלקית</h2><button class="warning" data-clear="expenses">מחק את כל ההוצאות</button><button class="warning" data-clear="income">מחק את כל ההכנסות הידניות</button><button class="warning" data-clear="documents">מחק את כל המסמכים</button><button class="warning" data-clear="goals">מחק את כל היעדים</button><button class="warning" data-clear="debts">מחק את כל החובות וההלוואות</button><button class="warning" data-clear="reminders">מחק את כל החיובים העתידיים והתזכורות</button><div class="field"><label>חודש</label><input type="month" id="month"></div><button class="warning" id="clearMonth">מחק תנועות מהחודש שנבחר</button><div class="field"><label>מתאריך</label><input type="date" id="from"></div><div class="field"><label>עד תאריך</label><input type="date" id="to"></div><button class="warning" id="clearRange">מחק תנועות בטווח התאריכים</button></section><section class="card dangerZone"><h2 class="sectionTitle">איפוס מלא</h2><div class="muted">מוחק את השם, המדינה, ההכנסה, התקציב, החיסכון, התנועות, המסמכים, היעדים, החובות וכל יתר נתוני MoneyTalks במכשיר הזה.</div><button class="danger" id="reset">מחק הכל ואפס את MoneyTalks</button></section></main><script>(()=>{'use strict';const KEY='moneytalks-live-v1',$=x=>document.getElementById(x);let st=Object.assign({transactions:[],documents:[],goals:[],debts:[],reminders:[],categories:[]},JSON.parse(localStorage.getItem(KEY)||'{}'));const save=()=>localStorage.setItem(KEY,JSON.stringify(st));function render(){st.transactions=st.transactions||[];st.documents=st.documents||[];st.goals=st.goals||[];st.debts=st.debts||[];st.reminders=st.reminders||[];$('txCount').textContent=st.transactions.length;$('docCount').textContent=st.documents.length;$('goalCount').textContent=st.goals.length;$('debtCount').textContent=st.debts.length;let rows=[];st.transactions.slice().reverse().slice(0,25).forEach(t=>rows.push(`<div class="item row"><div class="grow"><b>${t.category||t.type||'תנועה'}</b><div class="small">${t.date||''} · ${Number(t.amount||0).toLocaleString()}</div></div><button class="mini" data-del="tx" data-id="${t.id}">מחק</button></div>`));st.documents.slice().reverse().slice(0,15).forEach(d=>rows.push(`<div class="item row"><div class="grow"><b>📄 ${d.merchant||d.name||'מסמך'}</b><div class="small">${d.type||''} · ${d.date||''}</div></div><button class="mini" data-del="doc" data-id="${d.id}">מחק</button></div>`));st.goals.slice().reverse().forEach((g,i)=>rows.push(`<div class="item row"><div class="grow"><b>🎯 ${g.name||'יעד'}</b><div class="small">${Number(g.target||0).toLocaleString()}</div></div><button class="mini" data-del="goal" data-idx="${st.goals.length-1-i}">מחק</button></div>`));st.debts.slice().reverse().forEach((d,i)=>rows.push(`<div class="item row"><div class="grow"><b>💳 ${d.name||'חוב'}</b><div class="small">${Number(d.balance||0).toLocaleString()}</div></div><button class="mini" data-del="debt" data-idx="${st.debts.length-1-i}">מחק</button></div>`));$('items').innerHTML=rows.join('')||'<div class="notice">אין כרגע נתונים למחיקה נקודתית.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('למחוק רק את הפריט הזה?'))return;let type=b.dataset.del;if(type==='tx')st.transactions=st.transactions.filter(x=>String(x.id)!==String(b.dataset.id));if(type==='doc')st.documents=st.documents.filter(x=>String(x.id)!==String(b.dataset.id));if(type==='goal')st.goals.splice(+b.dataset.idx,1);if(type==='debt')st.debts.splice(+b.dataset.idx,1);save();render()})}function clear(kind){let label={expenses:'כל ההוצאות',income:'כל ההכנסות הידניות',documents:'כל המסמכים',goals:'כל היעדים',debts:'כל החובות וההלוואות',reminders:'כל החיובים העתידיים והתזכורות'}[kind];if(!confirm(`למחוק ${label}? פעולה זו לא ניתנת לביטול.`))return;if(kind==='expenses')st.transactions=st.transactions.filter(x=>x.type!=='expense');if(kind==='income')st.transactions=st.transactions.filter(x=>x.type!=='income');if(kind==='documents')st.documents=[];if(kind==='goals')st.goals=[];if(kind==='debts')st.debts=[];if(kind==='reminders')st.reminders=[];save();render()}document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clear(b.dataset.clear));$('clearMonth').onclick=()=>{let m=$('month').value;if(!m)return alert('בחר חודש.');if(!confirm(`למחוק את כל התנועות של ${m}?`))return;st.transactions=st.transactions.filter(x=>!x.date||x.date.slice(0,7)!==m);save();render()};$('clearRange').onclick=()=>{let f=$('from').value,t=$('to').value;if(!f||!t)return alert('בחר תאריך התחלה וסיום.');if(f>t)return alert('טווח התאריכים אינו תקין.');if(!confirm(`למחוק תנועות בין ${f} ל-${t}?`))return;st.transactions=st.transactions.filter(x=>!x.date||x.date<f||x.date>t);save();render()};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:'application/json'}));a.download=`moneytalks-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{let first=confirm('זה ימחק את כל נתוני MoneyTalks במכשיר הזה. להמשיך?');if(!first)return;let phrase=prompt('לאישור סופי, הקלד: מחק הכל');if(phrase!=='מחק הכל')return alert('האיפוס בוטל.');localStorage.removeItem(KEY);alert('כל הנתונים נמחקו. MoneyTalks ייפתח כמשתמש חדש.');location.href='./'};render()})();</script></body></html>
