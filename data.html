<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>MoneyTalks | ניהול נתונים</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#748198;--line:#e5eaf2;--blue:#2864f0;--red:#e5484d;--shadow:0 10px 28px #23395d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:560px;margin:auto;padding:18px 14px 60px}.head,.row{display:flex;align-items:center;gap:10px}.head{justify-content:space-between}.grow{flex:1}.back{border:0;background:#fff;border-radius:14px;padding:10px 13px;color:var(--blue);font-size:18px;box-shadow:var(--shadow)}h1{font-size:23px;margin:8px 0}.muted,.small{color:var(--muted);font-size:11px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:12px;box-shadow:var(--shadow)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px}.metric b{display:block;font-size:19px;margin-top:4px}.actions{display:flex;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:10px;color:var(--blue)}.mini.delete{color:var(--red)}.soft,.warning,.danger,.primary{width:100%;border-radius:13px;padding:12px;font-weight:800;margin-top:9px}.soft{border:1px solid #2864f033;background:#2864f00b;color:var(--blue)}.warning{border:1px solid #f59e0b44;background:#f59e0b10;color:#a16207}.danger{border:1px solid #e5484d55;background:#e5484d0e;color:var(--red)}.dangerZone{border-color:#e5484d44;background:#fffafa}.field{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.field input,.field select{width:100%;border:0;outline:0;background:transparent;font:inherit}.modal{position:fixed;inset:0;background:#02061799;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto}.primary{border:0;background:linear-gradient(135deg,#3b82f6,#2864f0);color:#fff}</style></head><body><main class="app"><div class="head"><div><h1>🗂️ ניהול נתונים</h1><div class="muted">עריכה, מחיקה, גיבוי ואיפוס</div></div><button class="back" onclick="location.href='./'">‹</button></div><section class="card"><b>🔒 הנתונים נשמרים במכשיר</b><p class="muted">אפשר לערוך או למחוק תנועה בודדת בלי לפגוע בשאר הנתונים.</p><button class="soft" id="backup">💾 הורד גיבוי</button></section><section class="card"><div class="summary"><div class="metric"><span class="small">תנועות</span><b id="txCount">0</b></div><div class="metric"><span class="small">מסמכים</span><b id="docCount">0</b></div></div></section><section class="card"><b>תנועות</b><div class="muted">כל הוצאה או הכנסה ניתנת לעריכה או למחיקה. מחיקת תנועה ממסמך מוחקת רק את השורה הזו.</div><div id="txList"></div></section><section class="card"><b>מסמכים</b><div id="docList"></div></section><section class="card"><b>מחיקה חלקית</b><button class="warning" id="clearExpenses">מחק את כל ההוצאות</button><button class="warning" id="clearDocs">מחק את כל המסמכים והתנועות שנוצרו מהם</button></section><section class="card dangerZone"><b>איפוס מלא</b><button class="danger" id="reset">מחק הכל ואפס</button></section></main><div class="modal" id="editModal"><div class="sheet"><div class="head"><h2 style="margin:0">עריכת תנועה</h2><button class="back" id="close">×</button></div><div class="field"><label>בית עסק</label><input id="merchant"></div><div class="field"><label>סכום</label><input id="amount" type="number" step="0.01"></div><div class="field"><label>תאריך</label><input id="date" type="date"></div><div class="field"><label>קטגוריה</label><select id="category"></select></div><div class="field"><label>סוג</label><select id="type"><option value="expense">הוצאה</option><option value="income">הכנסה</option><option value="saving">חיסכון</option></select></div><button class="primary" id="saveEdit">שמור שינויים</button></div></div><script>(()=>{'use strict';const KEY='moneytalks-live-v1',CATS=['סופרמרקט','מסעדות ובתי קפה','סיגריות ומוצרי טבק','בילויים ופנאי','ביגוד והנעלה','בריאות','דלק','רכב','תחבורה ציבורית','קניות לבית','מנויים ושירותים דיגיטליים','חשמל','ארנונה','אינטרנט','סלולר','ביטוחים','חופשות וטיסות','דיור / שכירות / משכנתא','הלוואות והחזרים','אחר'],$=x=>document.getElementById(x);let st=load(),editId=null;function load(){let x=JSON.parse(localStorage.getItem(KEY)||'{}');x.transactions=Array.isArray(x.transactions)?x.transactions:[];x.documents=Array.isArray(x.documents)?x.documents:[];return x}function save(){localStorage.setItem(KEY,JSON.stringify(st))}function fmt(n){return new Intl.NumberFormat(st.locale||'he-IL',{style:'currency',currency:st.currency||'ILS',maximumFractionDigits:2}).format(+n||0)}function render(){$('txCount').textContent=st.transactions.length;$('docCount').textContent=st.documents.length;$('txList').innerHTML=st.transactions.slice().reverse().map(t=>`<div class="item row"><div class="grow"><b>${t.merchant||t.category||'תנועה'}</b><div class="small">${t.date||''} · ${t.category||''} · ${fmt(t.amount)}${t.source==='document'?' · ממסמך':''}</div></div><div class="actions"><button class="mini" data-edit="${t.id}">עריכה</button><button class="mini delete" data-del="${t.id}">מחיקה</button></div></div>`).join('')||'<div class="muted">אין תנועות.</div>';$('docList').innerHTML=st.documents.slice().reverse().map(d=>`<div class="item row"><div class="grow"><b>📄 ${d.name||d.merchant||'מסמך'}</b><div class="small">${d.rowCount||0} תנועות · ${fmt(d.amount||0)}</div></div><button class="mini delete" data-doc="${d.id}">מחיקה</button></div>`).join('')||'<div class="muted">אין מסמכים.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('למחוק רק את התנועה הזו?')){st.transactions=st.transactions.filter(x=>String(x.id)!==String(b.dataset.del));save();render()}});document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{let id=b.dataset.doc;if(confirm('למחוק את המסמך ואת כל התנועות שנוצרו ממנו?')){st.documents=st.documents.filter(x=>String(x.id)!==String(id));st.transactions=st.transactions.filter(x=>String(x.documentId)!==String(id));save();render()}})}function openEdit(id){let t=st.transactions.find(x=>String(x.id)===String(id));if(!t)return;editId=id;$('merchant').value=t.merchant||'';$('amount').value=t.amount||'';$('date').value=t.date||'';$('type').value=t.type||'expense';$('category').innerHTML=CATS.map(c=>`<option${c===t.category?' selected':''}>${c}</option>`).join('');$('editModal').classList.add('show')}$('close').onclick=()=>$('editModal').classList.remove('show');$('saveEdit').onclick=()=>{let t=st.transactions.find(x=>String(x.id)===String(editId));if(!t)return;t.merchant=$('merchant').value.trim();t.amount=+$('amount').value||0;t.date=$('date').value;t.category=$('category').value;t.type=$('type').value;save();$('editModal').classList.remove('show');render()};$('clearExpenses').onclick=()=>{if(confirm('למחוק את כל ההוצאות?')){st.transactions=st.transactions.filter(x=>x.type!=='expense');save();render()}};$('clearDocs').onclick=()=>{if(confirm('למחוק את כל המסמכים ואת כל התנועות שנוצרו מהם?')){let ids=new Set(st.documents.map(x=>String(x.id)));st.documents=[];st.transactions=st.transactions.filter(x=>!ids.has(String(x.documentId)));save();render()}};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:'application/json'}));a.download='moneytalks-backup.json';a.click()};$('reset').onclick=()=>{if(!confirm('למחוק את כל נתוני MoneyTalks?'))return;let p=prompt('להשלמת האיפוס הקלד: מחק הכל');if(p==='מחק הכל'){localStorage.removeItem(KEY);location.href='./'}};render()})();</script></body></html>
