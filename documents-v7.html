<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>MoneyTalks | מסמכים ומצלמה</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif}#docs{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f}.camera-bar{position:fixed;z-index:50;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:7px}.camera-btn{width:62px;height:62px;border:0;border-radius:50%;background:#19d3a7;color:#07111f;box-shadow:0 8px 28px #0008;font-size:27px;font-weight:900;display:flex;align-items:center;justify-content:center}.camera-label{background:#07111fe8;color:#fff;border:1px solid #20314a;border-radius:999px;padding:6px 9px;font-size:10px;white-space:nowrap}.camera-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.toast{position:fixed;z-index:70;left:50%;bottom:calc(102px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(15px);background:#0d1929;color:#fff;border:1px solid #20314a;border-radius:13px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;max-width:80%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<iframe id="docs" src="documents-v6.html?v=20260822d" title="מסמכים חכמים"></iframe>
<div class="camera-bar">
<label class="camera-btn" for="camera" aria-label="צלם מסמך">📷</label>
<div class="camera-label">צלם מסמך</div>
<input class="camera-input" id="camera" type="file" accept="image/*" capture="environment">
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const frame=document.getElementById('docs'),camera=document.getElementById('camera'),toast=document.getElementById('toast');
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function sendToAnalyzer(file){
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    const target=doc.getElementById('files');
    if(!target)throw new Error('upload input not ready');
    const dt=new DataTransfer();dt.items.add(file);target.files=dt.files;
    target.dispatchEvent(new Event('change',{bubbles:true}));
    say('התמונה צולמה ונשלחה לניתוח');
    setTimeout(()=>{try{frame.contentWindow.scrollTo({top:0,behavior:'smooth'})}catch(e){}},250);
  }catch(e){
    say('הצילום נשמר בבחירה, נסה שוב או השתמש בכפתור בחירת מסמכים');
  }
}
camera.addEventListener('change',()=>{const file=camera.files&&camera.files[0];if(file)sendToAnalyzer(file);camera.value=''});
frame.addEventListener('load',()=>say('אפשר להעלות קובץ או לצלם מסמך במקום'));
})();
</script>
</body>
</html>
