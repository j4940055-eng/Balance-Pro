<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoneyTalks</title><style>html,body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;min-height:100%}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.dot{width:34px;height:34px;margin:0 auto 14px;border:3px solid #20314a;border-top-color:#19d3a7;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#err{display:none;color:#ff8797;line-height:1.6}button{border:0;border-radius:14px;padding:13px 18px;background:#19d3a7;color:#07111f;font-weight:800}</style></head><body><div class="boot" id="boot"><div><div class="dot"></div><b>פותח את MoneyTalks…</b><p id="err"></p><button id="retry" style="display:none" onclick="location.reload()">נסה שוב</button></div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}const r=await fetch('app.html?v=20260822g',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.dot').style.display='none';const p=document.getElementById('err');p.style.display='block';p.textContent='לא הצלחנו לטעון את האפליקציה. '+e.message;document.getElementById('retry').style.display='inline-block'}})();</script></body></html>
