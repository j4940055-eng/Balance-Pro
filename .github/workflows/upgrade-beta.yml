name: Upgrade MoneyTalks beta
on:
  push:
    branches: [main]
    paths:
      - scripts/upgrade-index.py
      - .github/workflows/upgrade-beta.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply upgrade
        run: python scripts/upgrade-index.py
      - name: Commit upgraded app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already upgraded"
          else
            git commit -m "Upgrade UI and fix salary and money model"
            git push
          fi
