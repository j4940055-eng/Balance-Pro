name: Sync outputs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test finance and document logic
        run: |
          node tests/money-core.test.js
          node tests/document-engine.test.js

      - name: Wire tested document engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('documents-v6.html')
          if not p.exists(): raise SystemExit('documents-v6.html missing')
          s=p.read_text()
          if 'document-engine.js' not in s:
              s=s.replace('<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>','<script src="document-engine.js?v=20260823b"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>',1)
          replacements={
            "const TYPES={credit_card:'כרטיס אשראי',bank:'דף חשבון / עו״ש',receipt:'קבלה / חשבונית',salary:'תלוש / הכנסה',loan:'הלוואה / החזר',web:'צילום אתר / מסמך לא פיננסי',other:'אחר'};const CATS=['סופרמרקט','מסעדות ובתי קפה','סיגריות ומוצרי טבק','דיור','רכב','דלק','תחבורה','בילויים','קניות','חשבונות','סלולר ואינטרנט','בריאות','ביטוחים','חופשות','ילדים','מנויים','עמלות וריביות','אגרות ושירותים','העברות ותשלומים','הלוואות והחזרים','אחר'];":"const TYPES=MTDoc.TYPES;const CATS=MTDoc.CATEGORIES;",
            "function norm(s){return String(s||'').toLowerCase().replace(/[״\"'׳']/g,'').replace(/\\s+/g,' ').trim()}":"const norm=MTDoc.norm;",
            "function classify(s){s=norm(s);let rules=[['סיגריות ומוצרי טבק',/טבק|סיגר|tobacco|פוינט|point(?:\\s|$)/],['סופרמרקט',/שופרסל|רמי לוי|carrefour|קרפור|ויקטורי|יוחננוף|מגה|סטופמרקט|מינימרקט|סופר|am:pm|טיב טעם/],['מסעדות ובתי קפה',/wolt|וולט|קפה|מסעד|bakery|בייקרי|רולדין|פטיסרי|שומשום|שרונה|ארומה|greg|קפה קפה/],['תחבורה',/gett|מונית|taxi|רכבת|אגד|דן /],['דלק',/פז|yellow|סונול|דור אלון|דלק|fuel/],['בריאות',/כללית|מכבי|מאוחדת|לאומית|פארם|pharm|רופא|בריאות|תרופה/],['ביטוחים',/מנורה|מבטחים|הראל|הפניקס|כלל ביטוח|ביטוח/],['סלולר ואינטרנט',/פרטנר|partner|סלקום|cellcom|פלאפון|hot mobile|תקשורת/],['עמלות וריביות',/דמי כרטיס|עמלה|ריבית|הנפקה/],['אגרות ושירותים',/שגרירות|קונסול|אגרה|משרד הפנים|רשות/],['העברות ותשלומים',/bit|paybox|העברה/],['קניות',/zara|nike|adidas|h&m|חנות|shop/],['חשבונות',/חשמל|מים|ארנונה|electric|water/],['מנויים',/netflix|spotify|apple|google|מנוי/]];for(const[c,r]of rules)if(r.test(s))return c;return'אחר'}":"const classify=MTDoc.classify;",
            "function txKind(s){s=norm(s);if(/משיכת מזומנים|משיכה מכספומט/.test(s))return'transfer';if(/זיכוי|החזר כספי|ביטול עסקה/.test(s))return'refund';return'expense'}":"const txKind=MTDoc.txKind;",
          }
          for old,new in replacements.items():
              if old in s: s=s.replace(old,new,1)
          # Prefer the tested engine for OCR line parsing and metadata detection.
          s=s.replace("let type=detectType(d.text,d.ratio),source=detectSource(d.text),statementTotalMinor=statementTotal(d.text);","let type=MTDoc.detectType(d.text,d.ratio),source=MTDoc.detectSource(d.text),statementTotalMinor=MTDoc.statementTotal(d.text);",1)
          s=s.replace("let lines=Object.values(groups).map(a=>a.sort((x,y)=>x.x-y.x).map(x=>x.text).join(' '));return{lines,rows:linesToRows(lines)}","let lines=Object.values(groups).map(a=>a.sort((x,y)=>x.x-y.x).map(x=>x.text).join(' '));return{lines,rows:MTDoc.parseLines(lines,new Date())}",1)
          s=s.replace("if(p.rows.length<2)p.rows=linesToRows(text.split(/\\r?\\n/));","if(p.rows.length<2)p.rows=MTDoc.parseLines(text.split(/\\r?\\n/),new Date());",1)
          s=s.replace("all.push(...linesToRows(lines))","all.push(...MTDoc.parseLines(lines,new Date()))",1)
          s=s.replace("return{text,rows:linesToRows(text.split(/\\r?\\n/)),ratio:1}","return{text,rows:MTDoc.parseLines(text.split(/\\r?\\n/),new Date()),ratio:1}",1)
          p.write_text(s)
          print('Tested document engine wired')
          PY

      - name: Copy current app files to outputs
        run: |
          mkdir -p outputs
          for file in index.html app.html app.js app-core.js ui.css home-plan.js home-plan.css document-engine.js documents.html documents-v6.html search.html data.html loans.html manifest.json sw.js icon.svg; do
            if [ -f "$file" ]; then cp "$file" "outputs/$file"; fi
          done

      - name: Commit source fixes and outputs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documents-v6.html outputs/
          if git diff --cached --quiet; then
            echo "app and outputs already up to date"
          else
            git commit -m "Wire tested document engine and sync outputs"
            git push
          fi
