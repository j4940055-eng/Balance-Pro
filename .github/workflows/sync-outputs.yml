name: Sync outputs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current app files to outputs
        run: |
          mkdir -p outputs
          cp index.html outputs/index.html
          cp documents-v2.html outputs/documents-v2.html

      - name: Commit outputs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/index.html outputs/documents-v2.html
          if git diff --cached --quiet; then
            echo "outputs already up to date"
          else
            git commit -m "Sync current files to outputs"
            git push
          fi
