name: Sync outputs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current app files to outputs
        run: |
          mkdir -p outputs
          for file in index.html documents.html documents-v2.html documents-v3.html documents-v4.html search.html data.html loans.html manifest.json sw.js; do
            if [ -f "$file" ]; then
              cp "$file" "outputs/$file"
            fi
          done

      - name: Commit outputs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "outputs already up to date"
          else
            git commit -m "Sync current app files to outputs"
            git push
          fi
