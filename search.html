<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>MoneyTalks | חיפוש</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#748198;--line:#e5eaf2;--blue:#2864f0;--red:#e5484d;--green:#12b76a;--shadow:0 10px 28px #23395d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:500px;margin:auto;padding:18px 14px 60px}.head,.row{display:flex;align-items:center;gap:10px}.head{justify-content:space-between}.back{border:0;background:#fff;border-radius:14px;padding:10px 13px;color:var(--blue);font-size:18px;box-shadow:var(--shadow)}h1{font-size:23px;margin:8px 0}.search{position:sticky;top:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:8px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:var(--text);font-size:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:10px;padding:13px;box-shadow:var(--shadow)}.grow{flex:1}.muted{color:var(--muted);font-size:11px}.amt{font-weight:800}.expense{color:var(--red)}.income{color:var(--green)}.pill{font-size:10px;background:#2864f012;color:var(--blue);padding:4px 7px;border-radius:999px}.empty{text-align:center;color:var(--muted);padding:50px 20px}.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center;text-decoration:none;padding:11px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--blue);font-weight:700;font-size:12px}</style></head><body><main class="app"><div class="head"><div><h1>🔎 חיפוש</h1><div class="muted">תנועות, מסמכים, יעדים, חובות, בתי עסק וקטגוריות</div></div><button class="back" onclick="location.href='./'">‹</button></div><div class="search"><span>🔎</span><input id="q" autofocus placeholder="מה אתה מחפש?"></div><div class="actions"><a href="documents.html">📄 מסמכים חכמים</a><a href="data.html">🗂️ ניהול נתונים</a></div><div id="results"></div></main><script>(()=>{const KEY='moneytalks-live-v1',$=x=>document.getElementById(x);let s=JSON.parse(localStorage.getItem(KEY)||'{}'),fmt=n=>new Intl.NumberFormat(s.locale||'he-IL',{style:'currency',currency:s.currency||'ILS',maximumFractionDigits:0}).format(+n||0);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=$('q').value.trim().toLowerCase(),out=[];if(!q){$('results').innerHTML='<div class="empty">הקלד שם בית עסק, קטגוריה, סכום, מסמך, יעד או חוב.</div>';return}(s.transactions||[]).forEach(t=>{let hay=[t.category,t.payment,t.merchant,t.date,t.amount,t.type].join(' ').toLowerCase();if(hay.includes(q))out.push(`<div class="card row"><span class="pill">תנועה</span><div class="grow"><b>${esc(t.merchant||t.category||'תנועה')}</b><div class="muted">${esc(t.category||'')} · ${esc(t.date||'')} · ${esc(t.payment||'')}</div></div><b class="amt ${t.type}">${t.type==='expense'?'-':'+'}${fmt(t.amount)}</b></div>`)});(s.documents||[]).forEach(d=>{let hay=[d.name,d.merchant,d.type,d.category,d.date,d.amount].join(' ').toLowerCase();if(hay.includes(q))out.push(`<div class="card row"><span class="pill">מסמך</span><div class="grow"><b>📄 ${esc(d.merchant||d.name||'מסמך')}</b><div class="muted">${esc(d.type||'')} · ${esc(d.category||'')} · ${esc(d.date||'')}</div></div></div>`)});(s.goals||[]).forEach(g=>{let hay=[g.name,g.target,g.current].join(' ').toLowerCase();if(hay.includes(q))out.push(`<div class="card row"><span class="pill">יעד</span><div class="grow"><b>🎯 ${esc(g.name||'יעד')}</b><div class="muted">יעד ${fmt(g.target)}</div></div></div>`)});(s.debts||[]).forEach(d=>{let hay=[d.name,d.balance,d.payment].join(' ').toLowerCase();if(hay.includes(q))out.push(`<div class="card row"><span class="pill">חוב</span><div class="grow"><b>💳 ${esc(d.name||'חוב')}</b><div class="muted">יתרה ${fmt(d.balance)}</div></div></div>`)});$('results').innerHTML=out.join('')||'<div class="empty">לא נמצאו תוצאות. נסה חיפוש אחר.</div>'}$('q').addEventListener('input',render);render()})();</script></body></html>
