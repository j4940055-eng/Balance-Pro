<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>MoneyTalks | חיפוש</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#748198;--line:#e5eaf2;--blue:#2864f0;--red:#e5484d;--green:#12b76a;--shadow:0 10px 28px #23395d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:520px;margin:auto;padding:18px 14px 60px}.head,.row{display:flex;align-items:center;gap:10px}.head{justify-content:space-between}.back{border:0;background:#fff;border-radius:14px;padding:10px 13px;color:var(--blue);font-size:18px;box-shadow:var(--shadow)}h1{font-size:23px;margin:8px 0}.muted{color:var(--muted);font-size:11px}.search{position:sticky;top:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:8px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:var(--text);font-size:16px}.clear{border:0;background:none;color:var(--muted);font-size:18px}.filters,.recent{display:flex;gap:7px;overflow:auto;padding:10px 1px 2px}.filter,.history{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;color:var(--text)}.filter.active{background:#2864f0;color:#fff;border-color:#2864f0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:10px;padding:13px;box-shadow:var(--shadow)}.grow{flex:1}.amt{font-weight:800}.expense{color:var(--red)}.income{color:var(--green)}.pill{font-size:10px;background:#2864f012;color:var(--blue);padding:4px 7px;border-radius:999px}.empty{text-align:center;color:var(--muted);padding:45px 20px}.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center;text-decoration:none;padding:11px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--blue);font-weight:700;font-size:12px}.count{font-size:11px;color:var(--muted);margin:12px 2px 2px}.section{font-size:12px;font-weight:800;margin-top:13px}</style></head><body><main class="app"><div class="head"><div><h1>🔎 חיפוש</h1><div class="muted">חיפוש אחד בכל MoneyTalks</div></div><button class="back" onclick="location.href='./'">‹</button></div><div class="search"><span>🔎</span><input id="q" autofocus autocomplete="off" placeholder="חפש בית עסק, קטגוריה, סכום, מסמך, יעד או חוב"><button class="clear" id="clear">×</button></div><div class="filters" id="filters"><button class="filter active" data-type="all">הכל</button><button class="filter" data-type="transaction">תנועות</button><button class="filter" data-type="document">מסמכים</button><button class="filter" data-type="goal">יעדים</button><button class="filter" data-type="debt">הלוואות</button></div><div id="recentWrap"><div class="section">חיפושים אחרונים</div><div class="recent" id="recent"></div></div><div class="actions"><a href="documents.html">📄 מסמכים חכמים</a><a href="data.html">🗂️ ניהול נתונים</a></div><div class="count" id="count"></div><div id="results"></div></main><script>(()=>{'use strict';const KEY='moneytalks-live-v1',HKEY='moneytalks-search-history',$=x=>document.getElementById(x);let s=JSON.parse(localStorage.getItem(KEY)||'{}'),history=JSON.parse(localStorage.getItem(HKEY)||'[]'),active='all';const fmt=n=>new Intl.NumberFormat(s.locale||'he-IL',{style:'currency',currency:s.currency||'ILS',maximumFractionDigits:0}).format(+n||0);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(x){return String(x??'').toLowerCase().trim()}function matches(q,vals){return norm(vals.join(' ')).includes(q)}function addHistory(q){q=q.trim();if(q.length<2)return;history=[q,...history.filter(x=>x!==q)].slice(0,6);localStorage.setItem(HKEY,JSON.stringify(history));renderHistory()}function renderHistory(){if(!history.length){$('recentWrap').style.display='none';return}$('recentWrap').style.display=$('q').value?'none':'block';$('recent').innerHTML=history.map((h,i)=>`<button class="history" data-h="${i}">🕘 ${esc(h)}</button>`).join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{$('q').value=history[+b.dataset.h];render();$('q').focus()})}function item(type,label,title,sub,right='',cls=''){return`<div class="card row"><span class="pill">${label}</span><div class="grow"><b>${title}</b><div class="muted">${sub}</div></div>${right?`<b class="amt ${cls}">${right}</b>`:''}</div>`}function render(){let q=norm($('q').value),out=[];renderHistory();if(!q){$('count').textContent='';$('results').innerHTML='<div class="empty">התחל להקליד כדי לחפש בכל התנועות, המסמכים, היעדים וההלוואות שלך.</div>';return}if(active==='all'||active==='transaction')(s.transactions||[]).forEach(t=>{if(matches(q,[t.category,t.payment,t.merchant,t.date,t.amount,t.type,t.loanName]))out.push(item('transaction','תנועה',esc(t.merchant||t.loanName||t.category||'תנועה'),`${esc(t.category||'')} · ${esc(t.date||'')} · ${esc(t.payment||'')}`,`${t.type==='expense'?'-':'+'}${fmt(t.amount)}`,t.type))});if(active==='all'||active==='document')(s.documents||[]).forEach(d=>{if(matches(q,[d.name,d.merchant,d.type,d.category,d.date,d.amount]))out.push(item('document','מסמך','📄 '+esc(d.merchant||d.name||'מסמך'),`${esc(d.type||'')} · ${esc(d.category||'')} · ${esc(d.date||'')}`))});if(active==='all'||active==='goal')(s.goals||[]).forEach(g=>{if(matches(q,[g.name,g.target,g.current]))out.push(item('goal','יעד','🎯 '+esc(g.name||'יעד'),`יעד ${fmt(g.target)} · נצבר ${fmt(g.current)}`))});if(active==='all'||active==='debt')(s.debts||[]).forEach(d=>{if(matches(q,[d.name,d.loanType,d.balance,d.payment,d.rate]))out.push(item('debt','הלוואה','💳 '+esc(d.name||'הלוואה'),`${esc(d.loanType||'')} · יתרה ${fmt(d.balance)} · ${d.rate||0}%`))});$('count').textContent=`${out.length} תוצאות`;$('results').innerHTML=out.join('')||'<div class="empty">לא נמצאו תוצאות. נסה מילה אחרת או בחר "הכל".</div>'}let timer;$('q').addEventListener('input',()=>{clearTimeout(timer);render();timer=setTimeout(()=>addHistory($('q').value),900)});$('q').addEventListener('keydown',e=>{if(e.key==='Enter')addHistory($('q').value)});$('clear').onclick=()=>{$('q').value='';render();$('q').focus()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{active=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});renderHistory();render()})();</script></body></html>
