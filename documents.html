<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>MoneyTalks | מסמכים חכמים</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#748198;--line:#e5eaf2;--blue:#2864f0;--green:#12b76a;--red:#f04464;--shadow:0 10px 28px #23395d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:520px;margin:auto;padding:18px 14px 50px}.head,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{border:0;background:#fff;border-radius:14px;padding:10px 13px;color:var(--blue);font-size:18px;box-shadow:var(--shadow)}h1{font-size:23px;margin:8px 0}.muted{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:12px;box-shadow:var(--shadow)}.upload{border:2px dashed #8b5cf677;text-align:center;padding:28px 14px;transition:.2s;cursor:pointer}.upload.drag{border-color:var(--blue);background:#2864f00b;transform:scale(1.01)}.upload input{display:none}.btn,.secondary,.danger{width:100%;border:0;border-radius:13px;padding:13px;font-weight:800;margin-top:9px}.btn{background:linear-gradient(135deg,#3b82f6,#2864f0);color:#fff}.secondary{background:#12b76a12;color:#087a48;border:1px solid #12b76a33}.danger{background:#f0446410;color:var(--red);border:1px solid #f0446430}.preview{min-height:170px;border-radius:16px;background:#eef2f8;overflow:hidden;display:grid;place-items:center;margin:12px 0}.preview img,.preview iframe{width:100%;height:290px;object-fit:contain;border:0}.field{display:grid;grid-template-columns:105px 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.field input,.field select{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--text);text-align:right}.queue{display:flex;gap:6px;overflow:auto;padding:7px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px}.chip.active{background:#2864f012;color:var(--blue);border-color:#2864f044}.status{padding:10px;border-radius:12px;background:#2864f00d;color:var(--muted);font-size:11px;margin-top:10px}.saved{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.grow{flex:1}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#12b76a15;color:#087a48}.hidden{display:none}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px;border-radius:14px;background:#2864f00b}.metric b{display:block;font-size:18px;margin-top:4px}.count{font-size:12px;color:var(--blue);margin-top:7px}.dropIcon{font-size:44px}.mini{font-size:10px;color:var(--muted);margin-top:5px}</style></head><body><main class="app"><div class="head"><div><h1>📄 מסמכים חכמים</h1><div class="muted">אפשר להעלות הרבה מסמכים יחד, לעבור עליהם אחד אחד ולאשר מה נכנס לחישובים</div></div><button class="back" onclick="location.href='./'">‹</button></div><section class="card"><div class="summary"><div class="metric"><span class="muted">הוצאות החודש</span><b id="monthExpense">0</b></div><div class="metric"><span class="muted">מסמכים שאושרו</span><b id="docCount">0</b></div></div></section><section class="card upload" id="dropZone"><div class="dropIcon">📥</div><b>גרור לכאן מסמכים מהמחשב</b><p class="muted">או לחץ לבחירת קבצים. אפשר לבחור ולהעלות כמה מסמכים בבת אחת.</p><label class="btn" style="display:block;cursor:pointer" for="files">בחר מספר מסמכים</label><input id="files" type="file" multiple accept="image/*,.pdf,.csv,.txt,.json"><div class="count" id="pendingCount">אין מסמכים בתור</div><div class="mini">PDF, תמונות, CSV, TXT ו-JSON</div></section><section id="review" class="hidden"><div class="card"><div class="head"><b>סקירת מסמכים</b><span class="badge" id="counter"></span></div><div class="queue" id="queue"></div><div class="preview" id="preview">📄</div><div class="field"><label>שם מסמך</label><input id="name"></div><div class="field"><label>סוג</label><select id="type"><option>קבלה</option><option>חשבונית</option><option>דוח אשראי</option><option>דוח בנק</option><option>ביטוח</option><option>פנסיה / גמל</option><option>מסמך אחר</option></select></div><div class="field"><label>פעולה</label><select id="direction"><option value="expense">הוצאה</option><option value="income">הכנסה</option><option value="document">מסמך בלבד</option></select></div><div class="field"><label>בית עסק</label><input id="merchant"></div><div class="field"><label>סכום כולל</label><input id="amount" type="number" step="0.01"></div><div class="field"><label>תאריך</label><input id="date" type="date"></div><div class="field"><label>קטגוריה</label><select id="category"></select></div><div class="field"><label>תשלום</label><select id="payment"><option>Card</option><option>Bank</option><option>Cash</option><option>Bit</option><option>PayBox</option><option>לא ידוע</option></select></div><div class="status" id="analysis"></div><button class="btn" id="approve">✓ אשר והוסף לחישובים</button><button class="secondary" id="keep">שמור כמסמך בלבד</button><button class="danger" id="reject">דלג על המסמך</button></div></section><section class="card"><b>מסמכים שאושרו</b><div id="saved"></div></section></main><script>(()=>{'use strict';const KEY='moneytalks-live-v1',EXP=['אוכל בחוץ','אינטרנט','ארנונה','ביגוד והנעלה','ביטוחים','בילויים ופנאי','בריאות','דלק','דיור / שכירות / משכנתא','חשמל','חופשות וטיסות','מסעדות ובתי קפה','מנויים ושירותים דיגיטליים','סופרמרקט','סלולר','קניות לבית','רכב','תחבורה ציבורית','אחר'],INC=['החזר כספי','הכנסה אחרת','השקעות','משכורת','פרילנס / עסק','קצבאות / מענקים','שכירות נכנסת'];let st=Object.assign({transactions:[],documents:[],categories:[],currency:'ILS',locale:'he-IL'},JSON.parse(localStorage.getItem(KEY)||'{}'));st.documents=Array.isArray(st.documents)?st.documents:[];st.transactions=Array.isArray(st.transactions)?st.transactions:[];let docs=[],idx=0,url=null,$=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat(st.locale||'he-IL',{style:'currency',currency:st.currency||'ILS',maximumFractionDigits:2}).format(+n||0);function save(){try{localStorage.setItem(KEY,JSON.stringify(st));return true}catch(e){alert('לא ניתן לשמור כרגע. ייתכן שאחסון הדפדפן מלא.');return false}}function classify(s){s=(s||'').toLowerCase();let rules=[['סופרמרקט',/shufersal|super|market|grocery|carrefour|rami levy|שופרסל|רמי לוי|ויקטורי|סופר|מכולת/],['מסעדות ובתי קפה',/restaurant|cafe|coffee|wolt|tenbis|pizza|burger|מסעד|קפה|וולט|תן ביס/],['ביגוד והנעלה',/zara|nike|adidas|fashion|clothing|shoe|ביגוד|נעל/],['דלק',/fuel|gas station|paz|delek|sonol|דלק|פז|סונול/],['בריאות',/pharm|medical|doctor|super.?pharm|סופר.?פארם|רופא|תרופה/],['ביטוחים',/insurance|ביטוח/],['חשמל',/electric|iec|חשמל/],['סלולר',/cellcom|partner|pelephone|סלקום|פלאפון|פרטנר/],['חופשות וטיסות',/hotel|booking|airbnb|flight|airline|מלון|טיסה/],['קניות לבית',/ikea|home center|ace|איקאה|הום סנטר/]];for(const [c,r] of rules)if(r.test(s))return c;return'אחר'}function typeOf(s){s=(s||'').toLowerCase();if(/invoice|חשבונית/.test(s))return'חשבונית';if(/insurance|ביטוח/.test(s))return'ביטוח';if(/bank/.test(s))return'דוח בנק';if(/credit|אשראי|ישראכרט|cal|max/.test(s))return'דוח אשראי';return'קבלה'}function amountOf(text){let vals=(text.match(/\b\d{1,6}[.,]\d{2}\b/g)||[]).map(x=>parseFloat(x.replace(',','.')));return vals.filter(x=>x>0&&x<1000000).sort((a,b)=>b-a)[0]||0}function dateOf(text){let m=text.match(/\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=text.match(/\b(\d{1,2})[/.](\d{1,2})[/.](20\d{2})\b/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return new Date().toISOString().slice(0,10)}async function analyze(file){let text=file.name,deep=false;if(/text|csv|json/.test(file.type)||/\.(csv|txt|json)$/i.test(file.name)){try{text+='\n'+(await file.text()).slice(0,100000);deep=true}catch(e){}}return{file,text,category:classify(text),type:typeOf(text),amount:amountOf(text),date:dateOf(text),merchant:file.name.replace(/\.[^.]+$/,''),deep,direction:'expense'}}function fillCats(sel){let arr=$('direction').value==='income'?INC:EXP;$('category').innerHTML=arr.map(x=>`<option${x===sel?' selected':''}>${x}</option>`).join('')}async function addFiles(fileList){let fs=[...fileList].filter(f=>f&&f.size>=0);if(!fs.length)return;$('pendingCount').textContent=`מוסיף ${fs.length} מסמכים...`;for(const f of fs)docs.push(await analyze(f));$('pendingCount').textContent=`${docs.length} מסמכים ממתינים לסקירה`;$('review').classList.remove('hidden');if(docs.length===fs.length){idx=0;load(0)}else load(idx)}function load(i){if(!docs.length){$('review').classList.add('hidden');$('pendingCount').textContent='אין מסמכים בתור';return}idx=Math.max(0,Math.min(i,docs.length-1));let d=docs[idx];$('counter').textContent=`${idx+1} מתוך ${docs.length}`;$('queue').innerHTML=docs.map((x,j)=>`<button class="chip ${j===idx?'active':''}" data-i="${j}">${j+1}. ${x.file.name.slice(0,24)}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>load(+b.dataset.i));$('name').value=d.file.name;$('type').value=d.type;$('direction').value=d.direction||'expense';$('merchant').value=d.merchant;$('amount').value=d.amount||'';$('date').value=d.date;fillCats(d.category);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(d.file);if(d.file.type.startsWith('image/'))$('preview').innerHTML=`<img src="${url}">`;else if(d.file.type==='application/pdf'||/\.pdf$/i.test(d.file.name))$('preview').innerHTML=`<iframe src="${url}"></iframe>`;else $('preview').innerHTML=`<div style="text-align:center"><div style="font-size:46px">📄</div><b>${d.file.name}</b><div class="muted">${Math.round(d.file.size/1024)} KB</div></div>`;$('analysis').textContent=d.deep?'תוכן הקובץ נקרא. בדוק את הסכום, התאריך והקטגוריה לפני אישור.':'המסמך מוכן לסקירה. ב-PDF ותמונות יש להשלים או לבדוק את הנתונים לפני אישור.'}function capture(){let d=docs[idx];Object.assign(d,{type:$('type').value,direction:$('direction').value,merchant:$('merchant').value.trim(),amount:+$('amount').value||0,date:$('date').value,category:$('category').value,payment:$('payment').value});return d}function duplicate(d){return st.transactions.find(t=>t.type===d.direction&&Math.abs((+t.amount||0)-d.amount)<0.01&&t.date===d.date&&((t.merchant&&d.merchant&&t.merchant.toLowerCase()===d.merchant.toLowerCase())||t.category===d.category))}function remove(){docs.splice(idx,1);if(idx>=docs.length)idx=Math.max(0,docs.length-1);$('pendingCount').textContent=docs.length?`${docs.length} מסמכים ממתינים לסקירה`:'אין מסמכים בתור';load(idx)}function persist(asTx){let d=capture();if(asTx&&d.direction!=='document'&&!d.amount)return alert('הזן סכום לפני הוספה לחישובים.');if(asTx&&duplicate(d)&&!confirm('נמצאה תנועה דומה באותו תאריך ובאותו סכום. להוסיף בכל זאת?'))return;let meta={id:'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:d.file.name,type:d.type,direction:asTx?d.direction:'document',merchant:d.merchant,amount:d.amount,date:d.date,category:d.category,payment:d.payment,created:new Date().toISOString()};st.documents.push(meta);if(asTx&&d.direction!=='document')st.transactions.push({id:Date.now()+Math.random(),type:d.direction,amount:d.amount,category:d.category,date:d.date,payment:d.payment,schedule:'once',source:'document',documentId:meta.id,merchant:d.merchant});if(!save())return;renderSaved();renderSummary();remove()}function renderSummary(){let m=new Date().toISOString().slice(0,7),sum=st.transactions.filter(t=>t.type==='expense'&&(t.date||'').slice(0,7)===m).reduce((a,t)=>a+(+t.amount||0),0);$('monthExpense').textContent=fmt(sum);$('docCount').textContent=st.documents.length}function renderSaved(){$('saved').innerHTML=st.documents.slice().reverse().slice(0,30).map(d=>`<div class="saved"><div style="font-size:24px">📄</div><div class="grow"><b>${d.merchant||d.name}</b><div class="muted">${d.type} · ${d.category||'ללא קטגוריה'}${d.amount?' · '+fmt(d.amount):''}</div></div><span class="badge">${d.direction==='document'?'נשמר':'נכנס לחישוב'}</span></div>`).join('')||'<div class="status">עדיין אין מסמכים שאושרו.</div>'}const dz=$('dropZone'),fi=$('files');fi.onchange=async e=>{await addFiles(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('drag')}));dz.addEventListener('drop',async e=>{await addFiles(e.dataTransfer.files)});dz.addEventListener('click',e=>{if(e.target.tagName!=='LABEL')fi.click()});$('direction').onchange=()=>fillCats($('category').value);$('approve').onclick=()=>persist(true);$('keep').onclick=()=>persist(false);$('reject').onclick=remove;renderSaved();renderSummary()})();</script></body></html>
