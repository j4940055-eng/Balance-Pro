<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>MoneyTalks | מסמכים חכמים</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#748198;--line:#e5eaf2;--blue:#2864f0;--green:#12b76a;--red:#f04464;--shadow:0 10px 28px #23395d16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:480px;margin:auto;padding:18px 14px 50px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{border:0;background:#fff;border-radius:14px;padding:10px 13px;color:var(--blue);font-size:18px;box-shadow:var(--shadow)}h1{font-size:23px;margin:8px 0}.muted{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:12px;box-shadow:var(--shadow)}.upload{border:2px dashed #8b5cf655;text-align:center;padding:24px 14px}.upload input{display:none}.btn,.secondary,.danger{width:100%;border:0;border-radius:13px;padding:13px;font-weight:800;margin-top:9px}.btn{background:linear-gradient(135deg,#3b82f6,#2864f0);color:#fff}.secondary{background:#12b76a12;color:#087a48;border:1px solid #12b76a33}.danger{background:#f0446410;color:var(--red);border:1px solid #f0446430}.preview{min-height:220px;border-radius:16px;background:#eef2f8;overflow:hidden;display:grid;place-items:center;margin-bottom:12px}.preview img,.preview iframe{width:100%;height:330px;object-fit:contain;border:0}.field{display:grid;grid-template-columns:105px 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.field input,.field select{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--text);text-align:right}.queue{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px}.chip.active{background:#2864f012;color:var(--blue);border-color:#2864f044}.status{padding:10px;border-radius:12px;background:#2864f00d;color:var(--muted);font-size:11px;margin-top:10px}.saved{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.grow{flex:1}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#12b76a15;color:#087a48}.hidden{display:none}</style></head><body><main class="app"><div class="head"><div><h1>📄 מסמכים חכמים</h1><div class="muted">סקירה ואישור לפני שהנתונים נכנסים ל-MoneyTalks</div></div><button class="back" onclick="location.href='./'">‹</button></div><section class="card upload" id="uploadBox"><div style="font-size:40px">📥</div><b>העלה מסמכים לסקירה</b><p class="muted">אפשר לבחור כמה קבלות, חשבוניות, תמונות או PDF בבת אחת.</p><label class="btn" style="display:block;cursor:pointer" for="files">בחר מסמכים</label><input id="files" type="file" multiple accept="image/*,.pdf,.csv,.txt,.json"></section><section id="review" class="hidden"><div class="card"><div class="head"><b>סקירת מסמך</b><span class="badge" id="counter"></span></div><div class="queue" id="queue"></div><div class="preview" id="preview">📄</div><div class="field"><label>שם מסמך</label><input id="name"></div><div class="field"><label>סוג</label><select id="type"><option>קבלה</option><option>חשבונית</option><option>דוח אשראי</option><option>דוח בנק</option><option>ביטוח</option><option>פנסיה / גמל</option><option>מסמך אחר</option></select></div><div class="field"><label>פעולה</label><select id="direction"><option value="expense">הוצאה</option><option value="income">הכנסה</option><option value="document">מסמך בלבד</option></select></div><div class="field"><label>בית עסק</label><input id="merchant" placeholder="למשל שופרסל"></div><div class="field"><label>סכום</label><input id="amount" type="number" step="0.01" placeholder="0"></div><div class="field"><label>תאריך</label><input id="date" type="date"></div><div class="field"><label>קטגוריה</label><select id="category"></select></div><div class="field"><label>תשלום</label><select id="payment"><option>Card</option><option>Bank</option><option>Cash</option><option>Bit</option><option>PayBox</option><option>לא ידוע</option></select></div><div class="status" id="analysis">בדוק את הנתונים לפני האישור. בגרסת הבטא הזיהוי הוא הצעה בלבד ואינו נשמר כתנועה ללא אישורך.</div><button class="btn" id="approve">✓ אשר והוסף לתנועות</button><button class="secondary" id="keep">שמור מסמך בלבד</button><button class="danger" id="reject">דלג / דחה מסמך</button></div></section><section class="card"><b>מסמכים שאושרו</b><div id="saved"></div></section></main><script>(()=>{'use strict';const KEY='moneytalks-live-v1',EXP=['אוכל בחוץ','אינטרנט','ארנונה','ביגוד והנעלה','ביטוחים','בילויים ופנאי','בריאות','דלק','דיור / שכירות / משכנתא','חשמל','חופשות וטיסות','מסעדות ובתי קפה','מנויים ושירותים דיגיטליים','סופרמרקט','סלולר','קניות לבית','רכב','תחבורה ציבורית','אחר'],INC=['החזר כספי','הכנסה אחרת','השקעות','משכורת','פרילנס / עסק','קצבאות / מענקים','שכירות נכנסת'];let st=Object.assign({transactions:[],documents:[],categories:[]},JSON.parse(localStorage.getItem(KEY)||'{}'));st.documents=st.documents||[];let docs=[],idx=0,url=null,$=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(st));function guess(name){let s=name.toLowerCase();if(/super|market|grocery|שופרסל|רמי|ויקטורי|סופר/.test(s))return['סופרמרקט','קבלה'];if(/restaurant|cafe|wolt|מסעד|קפה/.test(s))return['מסעדות ובתי קפה','קבלה'];if(/insurance|ביטוח/.test(s))return['ביטוחים','ביטוח'];if(/bank|בנק/.test(s))return['אחר','דוח בנק'];if(/visa|mastercard|ישראכרט|max|cal/.test(s))return['אחר','דוח אשראי'];return['אחר',/invoice|חשבונית/.test(s)?'חשבונית':'קבלה']}function load(i){if(!docs.length){$('review').classList.add('hidden');return}idx=Math.max(0,Math.min(i,docs.length-1));let d=docs[idx],g=guess(d.file.name);$('review').classList.remove('hidden');$('counter').textContent=`${idx+1} מתוך ${docs.length}`;$('queue').innerHTML=docs.map((x,j)=>`<button class="chip ${j===idx?'active':''}" data-i="${j}">${j+1}. ${x.file.name.slice(0,22)}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>load(+b.dataset.i));$('name').value=d.file.name;$('type').value=d.type||g[1];$('direction').value=d.direction||'expense';$('merchant').value=d.merchant||'';$('amount').value=d.amount||'';$('date').value=d.date||new Date().toISOString().slice(0,10);fillCats(d.category||g[0]);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(d.file);if(d.file.type.startsWith('image/'))$('preview').innerHTML=`<img src="${url}" alt="תצוגת מסמך">`;else if(d.file.type==='application/pdf'||d.file.name.toLowerCase().endsWith('.pdf'))$('preview').innerHTML=`<iframe src="${url}"></iframe>`;else $('preview').innerHTML=`<div style="text-align:center"><div style="font-size:46px">📄</div><b>${d.file.name}</b><div class="muted">${Math.round(d.file.size/1024)} KB</div></div>`;$('analysis').textContent=`הצעה ראשונית: ${g[1]} · ${g[0]}. ניתן לתקן כל שדה לפני האישור.`}function fillCats(selected){let arr=$('direction').value==='income'?INC:EXP;$('category').innerHTML=arr.map(x=>`<option${x===selected?' selected':''}>${x}</option>`).join('')}function capture(){let d=docs[idx];d.type=$('type').value;d.direction=$('direction').value;d.merchant=$('merchant').value.trim();d.amount=+$('amount').value||0;d.date=$('date').value;d.category=$('category').value;d.payment=$('payment').value;return d}function removeCurrent(){docs.splice(idx,1);if(idx>=docs.length)idx=Math.max(0,docs.length-1);load(idx)}function persist(asTx){let d=capture(),meta={id:'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:d.file.name,type:d.type,direction:asTx?d.direction:'document',merchant:d.merchant,amount:d.amount,date:d.date,category:d.category,payment:d.payment,created:new Date().toISOString()};st.documents.push(meta);if(asTx&&d.direction!=='document'){if(!d.amount)return alert('כדי להוסיף כתנועה צריך להזין סכום.');st.transactions.push({id:Date.now()+Math.random(),type:d.direction,amount:d.amount,category:d.category,date:d.date,payment:d.payment,schedule:'once',source:'document',documentId:meta.id,merchant:d.merchant})}save();renderSaved();removeCurrent()}function renderSaved(){$('saved').innerHTML=st.documents.slice().reverse().slice(0,20).map(d=>`<div class="saved"><div style="font-size:24px">📄</div><div class="grow"><b>${d.merchant||d.name}</b><div class="muted">${d.type} · ${d.category||'ללא קטגוריה'}${d.amount?' · '+d.amount:''}</div></div><span class="badge">${d.direction==='document'?'נשמר':'נוסף'}</span></div>`).join('')||'<div class="status">עדיין אין מסמכים שאושרו.</div>'}$('files').onchange=e=>{docs=[...e.target.files].map(file=>({file}));idx=0;load(0);e.target.value=''};$('direction').onchange=()=>fillCats($('category').value);$('approve').onclick=()=>persist(true);$('keep').onclick=()=>persist(false);$('reject').onclick=removeCurrent;renderSaved()})();</script></body></html>
